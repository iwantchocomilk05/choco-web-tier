<!doctype html><html lang='ko'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width, initial-scale=1.0'/><title>Webtoon Tier</title><link rel='stylesheet' href='styles.css'/></head><body>
<div class='bg-orb orb1'></div><div class='bg-orb orb2'></div>
<main>
<header class='hero'><h1>Webtoon Tier Lounge</h1><p>프리미엄 웹툰 리뷰 & 랭킹</p></header>
<section class='panel admin-panel'><div class='admin-row'><input id='admin-username' placeholder='관리자 ID'/><input id='admin-password' type='password' placeholder='비밀번호'/><button id='admin-login'>로그인</button><button id='admin-logout' class='ghost'>로그아웃</button></div><p id='admin-status'></p></section>
<section class='panel' id='add-section' hidden><h2>웹툰 추가</h2><form id='add-form'>
<input name='title' placeholder='웹툰 제목' required/><input name='genre' placeholder='장르'/><select name='tier'><option>S</option><option>A</option><option selected>B</option><option>C</option><option>D</option></select>
<input name='score' type='number' step='0.1' min='0' max='10' placeholder='점수 0~10' required/>
<select name='recommendation'><option value='recommend'>추천</option><option value='not_recommend'>비추천</option></select>
<input name='imageUrl' placeholder='표지 URL'/><input name='note' placeholder='한 줄 추천 이유'/><textarea name='reviewReason' placeholder='상세 평가 이유'></textarea><button>추가</button></form></section>
<section class='panel'><div id='tiers'></div></section>
</main>
<div id='detail-modal' class='modal hidden'><div class='modal-card'><button id='modal-close' class='ghost'>닫기</button><div id='detail-body'></div></div></div>
<script src='main.js'></script></body></html>
