<!doctype html><html lang='ko'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width, initial-scale=1.0'/><title>웹툰 평가</title><link rel='stylesheet' href='styles.css'/></head><body>
<div class='app-shell'>
<header id='hero' class='hero'><button id='menu-btn' class='icon-btn'>☰</button><h1>웹툰 평가</h1></header>
<aside id='admin-drawer' class='drawer hidden'><h3>관리자</h3><input id='admin-username' placeholder='ID'/><input id='admin-password' type='password' placeholder='PW'/><button id='admin-login'>로그인</button><button id='admin-logout' class='ghost'>로그아웃</button><p id='admin-status'></p></aside>
<main id='list-view'><section id='add-section' class='panel hidden'><button id='toggle-add-form' class='ghost'>작품 추가하기</button><form id='add-form' class='hidden'><input name='title' placeholder='작품 제목' required/><input name='genre' placeholder='장르'/><select name='tier'><option>S</option><option>A</option><option selected>B</option><option>C</option><option>D</option></select><input name='score' type='number' min='0' max='10' step='0.1' placeholder='점수(0~10)' required/><input name='imageUrl' placeholder='표지 이미지 URL'/><input name='note' placeholder='한 줄 평가'/><textarea name='reviewReason' placeholder='상세 평가 이유'></textarea><button>작품 등록</button></form></section><div id='tiers'></div></main>
<section id='detail-view' class='hidden'></section>
</div><script src='main.js'></script></body></html>
